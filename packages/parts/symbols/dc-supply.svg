<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 64">
  <!-- battery pack: + terminal left, - terminal right, matching the pin order -->
  <path d="M26 48v14M66 48v14" stroke="#b6bec5" stroke-width="4" stroke-linecap="round" />
  <rect x="8" y="8" width="76" height="42" rx="5" fill="#243040" stroke="#131b26" stroke-width="1.6" />
  <rect x="8" y="19" width="76" height="20" fill="#e2e8ef" />
  <rect x="8" y="8" width="14" height="42" rx="5" fill="#b5342f" />
  <rect x="70" y="8" width="14" height="42" rx="5" fill="#14181c" />
  <g font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="15" y="35">+</text>
    <text x="77" y="35">−</text>
  </g>
  <text x="46" y="35" fill="#243040" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DC</text>
  <rect x="24" y="11" width="44" height="5" rx="2.5" fill="#ffffff" opacity="0.16" />
</svg>
