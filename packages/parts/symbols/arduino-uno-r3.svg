<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27 21" data-grid="hole-pitch">
  <defs>
    <linearGradient id="uno-pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00a8ad" />
      <stop offset="1" stop-color="#007e83" />
    </linearGradient>
    <linearGradient id="uno-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f3" />
      <stop offset="0.45" stop-color="#bcc3c9" />
      <stop offset="1" stop-color="#8d969e" />
    </linearGradient>
    <linearGradient id="uno-header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33393f" />
      <stop offset="1" stop-color="#14181c" />
    </linearGradient>
    <g id="uno-hole">
      <rect x="-0.33" y="-0.33" width="0.66" height="0.66" rx="0.07" fill="#05070a" />
      <rect x="-0.2" y="-0.2" width="0.4" height="0.4" rx="0.05" fill="#c79a24" />
    </g>
    <g id="uno-mount">
      <circle r="0.45" fill="#0d7b80" />
      <circle r="0.3" fill="#f6f8fa" />
      <circle r="0.19" fill="#3b4147" />
    </g>
  </defs>

  <!-- board outline: 2.7 x 2.1 in, notched right edge -->
  <path d="M0.9 0.15H26.1a0.75 0.75 0 0 1 0.75 0.75V13.3H25.3V15.2H26.85V20.1a0.75 0.75 0 0 1-0.75 0.75H0.9a0.75 0.75 0 0 1-0.75-0.75V0.9a0.75 0.75 0 0 1 0.75-0.75Z" fill="url(#uno-pcb)" stroke="#00595d" stroke-width="0.12" />

  <!-- USB-B jack, overhanging the left edge -->
  <rect x="-0.35" y="1.1" width="4.1" height="4" rx="0.18" fill="url(#uno-metal)" stroke="#6f787f" stroke-width="0.1" />
  <rect x="-0.2" y="1.55" width="1.5" height="3.1" rx="0.12" fill="#7d868d" />
  <rect x="0.05" y="1.95" width="0.95" height="2.3" rx="0.1" fill="#2b3137" />
  <path d="M1.9 1.5v3.2M2.9 1.5v3.2" stroke="#9aa2a9" stroke-width="0.09" />

  <!-- barrel power jack -->
  <rect x="-0.35" y="15.6" width="4.2" height="4.2" rx="0.5" fill="#1b1f24" stroke="#000000" stroke-width="0.08" />
  <circle cx="0.75" cy="17.7" r="1.35" fill="#2d3339" />
  <circle cx="0.75" cy="17.7" r="0.85" fill="#0a0c0e" />
  <circle cx="0.75" cy="17.7" r="0.24" fill="#8a9299" />

  <!-- female header strips -->
  <rect x="10" y="0.45" width="7" height="1.1" rx="0.14" fill="url(#uno-header)" />
  <rect x="17.5" y="0.45" width="8" height="1.1" rx="0.14" fill="url(#uno-header)" />
  <rect x="8" y="19.45" width="5" height="1.1" rx="0.14" fill="url(#uno-header)" />
  <rect x="14" y="19.45" width="6" height="1.1" rx="0.14" fill="url(#uno-header)" />

  <!-- digital header holes: GND, D13..D8 | D7..D0 -->
  <g>
    <use href="#uno-hole" x="10.5" y="1" />
    <use href="#uno-hole" x="11.5" y="1" />
    <use href="#uno-hole" x="12.5" y="1" />
    <use href="#uno-hole" x="13.5" y="1" />
    <use href="#uno-hole" x="14.5" y="1" />
    <use href="#uno-hole" x="15.5" y="1" />
    <use href="#uno-hole" x="16.5" y="1" />
    <use href="#uno-hole" x="18" y="1" />
    <use href="#uno-hole" x="19" y="1" />
    <use href="#uno-hole" x="20" y="1" />
    <use href="#uno-hole" x="21" y="1" />
    <use href="#uno-hole" x="22" y="1" />
    <use href="#uno-hole" x="23" y="1" />
    <use href="#uno-hole" x="24" y="1" />
    <use href="#uno-hole" x="25" y="1" />
  </g>

  <!-- power header | analog header holes -->
  <g>
    <use href="#uno-hole" x="8.5" y="20" />
    <use href="#uno-hole" x="9.5" y="20" />
    <use href="#uno-hole" x="10.5" y="20" />
    <use href="#uno-hole" x="11.5" y="20" />
    <use href="#uno-hole" x="12.5" y="20" />
    <use href="#uno-hole" x="14.5" y="20" />
    <use href="#uno-hole" x="15.5" y="20" />
    <use href="#uno-hole" x="16.5" y="20" />
    <use href="#uno-hole" x="17.5" y="20" />
    <use href="#uno-hole" x="18.5" y="20" />
    <use href="#uno-hole" x="19.5" y="20" />
  </g>

  <!-- ATmega328P, PDIP-28 -->
  <g fill="#b9c0c6">
    <rect x="10.1" y="11.75" width="0.34" height="0.7" />
    <rect x="11.1" y="11.75" width="0.34" height="0.7" />
    <rect x="12.1" y="11.75" width="0.34" height="0.7" />
    <rect x="13.1" y="11.75" width="0.34" height="0.7" />
    <rect x="14.1" y="11.75" width="0.34" height="0.7" />
    <rect x="15.1" y="11.75" width="0.34" height="0.7" />
    <rect x="16.1" y="11.75" width="0.34" height="0.7" />
    <rect x="17.1" y="11.75" width="0.34" height="0.7" />
    <rect x="18.1" y="11.75" width="0.34" height="0.7" />
    <rect x="19.1" y="11.75" width="0.34" height="0.7" />
    <rect x="20.1" y="11.75" width="0.34" height="0.7" />
    <rect x="21.1" y="11.75" width="0.34" height="0.7" />
    <rect x="22.1" y="11.75" width="0.34" height="0.7" />
    <rect x="23.1" y="11.75" width="0.34" height="0.7" />
    <rect x="10.1" y="17.45" width="0.34" height="0.7" />
    <rect x="11.1" y="17.45" width="0.34" height="0.7" />
    <rect x="12.1" y="17.45" width="0.34" height="0.7" />
    <rect x="13.1" y="17.45" width="0.34" height="0.7" />
    <rect x="14.1" y="17.45" width="0.34" height="0.7" />
    <rect x="15.1" y="17.45" width="0.34" height="0.7" />
    <rect x="16.1" y="17.45" width="0.34" height="0.7" />
    <rect x="17.1" y="17.45" width="0.34" height="0.7" />
    <rect x="18.1" y="17.45" width="0.34" height="0.7" />
    <rect x="19.1" y="17.45" width="0.34" height="0.7" />
    <rect x="20.1" y="17.45" width="0.34" height="0.7" />
    <rect x="21.1" y="17.45" width="0.34" height="0.7" />
    <rect x="22.1" y="17.45" width="0.34" height="0.7" />
    <rect x="23.1" y="17.45" width="0.34" height="0.7" />
  </g>
  <rect x="9.6" y="12.3" width="14" height="5.3" rx="0.2" fill="#1c1f23" stroke="#0a0c0e" stroke-width="0.08" />
  <path d="M9.6 14.2a0.75 0.75 0 0 0 0 1.5Z" fill="#3a4046" />
  <circle cx="10.7" cy="13.3" r="0.25" fill="#3a4046" />
  <text x="16.6" y="15.35" fill="#c9d1d9" font-family="sans-serif" font-size="0.95" text-anchor="middle" opacity="0.9">ATMEGA328P</text>

  <!-- ICSP header, 2x3 -->
  <rect x="24.35" y="7.7" width="1.5" height="2.4" rx="0.12" fill="url(#uno-header)" />
  <g>
    <use href="#uno-hole" x="24.75" y="8.2" />
    <use href="#uno-hole" x="25.45" y="8.2" />
    <use href="#uno-hole" x="24.75" y="8.9" />
    <use href="#uno-hole" x="25.45" y="8.9" />
    <use href="#uno-hole" x="24.75" y="9.6" />
    <use href="#uno-hole" x="25.45" y="9.6" />
  </g>
  <text x="25.1" y="7.35" fill="#e6edf3" font-family="sans-serif" font-size="0.5" text-anchor="middle" opacity="0.8">ICSP</text>

  <!-- reset button -->
  <rect x="5" y="0.55" width="1.5" height="1.5" rx="0.16" fill="#2b3137" />
  <circle cx="5.75" cy="1.3" r="0.45" fill="#d9534f" />
  <text x="5.75" y="2.75" fill="#e6edf3" font-family="sans-serif" font-size="0.5" text-anchor="middle" opacity="0.8">RESET</text>

  <!-- crystal -->
  <rect x="5" y="12" width="2.5" height="1.4" rx="0.65" fill="url(#uno-metal)" stroke="#778087" stroke-width="0.07" />

  <!-- voltage regulator -->
  <rect x="5.2" y="16.5" width="2.4" height="1.9" rx="0.15" fill="#15181c" />
  <rect x="5.2" y="16.5" width="2.4" height="0.55" rx="0.12" fill="#9aa2a9" />

  <!-- electrolytic capacitors -->
  <circle cx="8.5" cy="17.4" r="1" fill="#1d2126" stroke="#0a0c0e" stroke-width="0.07" />
  <path d="M8.5 16.4a1 1 0 0 0 0 2Z" fill="#c9d1d9" opacity="0.5" />
  <circle cx="4.1" cy="14.4" r="0.85" fill="#1d2126" stroke="#0a0c0e" stroke-width="0.07" />
  <path d="M4.1 13.55a0.85 0.85 0 0 0 0 1.7Z" fill="#c9d1d9" opacity="0.5" />

  <!-- indicator LEDs -->
  <g>
    <rect x="8.2" y="3" width="0.85" height="0.5" rx="0.08" fill="#f0b429" />
    <rect x="8.2" y="3.9" width="0.85" height="0.5" rx="0.08" fill="#f0b429" />
    <rect x="8.2" y="4.8" width="0.85" height="0.5" rx="0.08" fill="#f0b429" />
    <rect x="4.3" y="6.6" width="0.85" height="0.5" rx="0.08" fill="#3fb950" />
  </g>
  <g fill="#e6edf3" font-family="sans-serif" font-size="0.5" opacity="0.8">
    <text x="9.3" y="3.45">TX</text>
    <text x="9.3" y="4.35">RX</text>
    <text x="9.3" y="5.25">L</text>
    <text x="5.4" y="7.05">ON</text>
  </g>

  <!-- mounting holes -->
  <use href="#uno-mount" x="2.4" y="12.2" />
  <use href="#uno-mount" x="7.6" y="9.4" />
  <use href="#uno-mount" x="24.6" y="18.6" />
  <use href="#uno-mount" x="24.6" y="3.4" />

  <!-- silkscreen: pin labels -->
  <g fill="#e6edf3" font-family="sans-serif" font-size="0.5" text-anchor="middle" opacity="0.95">
    <text x="10.5" y="2.3">GND</text>
    <text x="11.5" y="2.3">13</text>
    <text x="12.5" y="2.3">12</text>
    <text x="13.5" y="2.3">~11</text>
    <text x="14.5" y="2.3">~10</text>
    <text x="15.5" y="2.3">~9</text>
    <text x="16.5" y="2.3">8</text>
    <text x="18" y="2.3">7</text>
    <text x="19" y="2.3">~6</text>
    <text x="20" y="2.3">~5</text>
    <text x="21" y="2.3">4</text>
    <text x="22" y="2.3">~3</text>
    <text x="23" y="2.3">2</text>
    <text x="24" y="2.3">TX1</text>
    <text x="25" y="2.3">RX0</text>
    <text x="8.5" y="19">3V3</text>
    <text x="9.5" y="19">5V</text>
    <text x="10.5" y="19">GND</text>
    <text x="11.5" y="19">GND</text>
    <text x="12.5" y="19">VIN</text>
    <text x="14.5" y="19">A0</text>
    <text x="15.5" y="19">A1</text>
    <text x="16.5" y="19">A2</text>
    <text x="17.5" y="19">A3</text>
    <text x="18.5" y="19">A4</text>
    <text x="19.5" y="19">A5</text>
  </g>

  <!-- silkscreen: section names and wordmark -->
  <g fill="#e6edf3" font-family="sans-serif" font-size="0.62" font-weight="700" text-anchor="middle" opacity="0.85">
    <text x="17.7" y="3.45">DIGITAL (PWM ~)</text>
    <text x="10.5" y="18.2">POWER</text>
    <text x="17" y="18.2">ANALOG IN</text>
  </g>
  <text x="21.5" y="6.6" fill="#ffffff" font-family="sans-serif" font-size="2" font-weight="700" letter-spacing="0.18" text-anchor="middle" opacity="0.92">UNO</text>
  <text x="21.5" y="7.9" fill="#e6edf3" font-family="sans-serif" font-size="0.68" letter-spacing="0.1" text-anchor="middle" opacity="0.75">ARDUINO R3</text>
</svg>
